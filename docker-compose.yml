services:
  postgres:
    image: postgres:16
    container_name: portide_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portide_db}
      POSTGRES_USER: ${POSTGRES_USER:-portide_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portide_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portide_db}
      POSTGRES_USER: ${POSTGRES_USER:-portide_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-portide_db}
      DB_USER: ${POSTGRES_USER:-portide_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-django-insecure-ilu2@_(%iijbz%j!g951u+h=j(l6gnedz^gv55#@fu!k+1qs)&}
      DEBUG: ${DEBUG:-True}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    depends_on:
      - postgres

volumes:
  postgres_data:
