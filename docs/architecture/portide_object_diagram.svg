  <!-- ==================== SCENARIO EXPLANATION BOX ==================== -->
  <rect x="40" y="750" width="980" height="135" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="55" y="772" font-size="11" font-weight="bold" fill="#0f172a">Runtime Operational Workflow Illustrated in this Object Diagram:</text>
  <text x="55" y="792" font-size="10.5" fill="#334155">• Berth Assignment &amp; Discharge: Vessel MV Ocean Star (IMO9843214) is berthed at Berth 01. STS Quay Crane 1 is discharging manifested container MSKU9082341.</text>
  <text x="55" y="810" font-size="10.5" fill="#334155">• Yard Stacking: Terminal logistics operator has stacked the container into Yard A slot coordinate B04-R02-T03 (Bay 4, Row 2, Tier 3).</text>
  <text x="55" y="828" font-size="10.5" fill="#334155">• Customs Clearance: Customs Officer Verma completed inspection (DEC-2026-092) and set statutory customs_status = 'CLEARED'.</text>
  <text x="55" y="846" font-size="10.5" fill="#334155">• QR Gate Pass Generation: Upon clearance, GatePass GP-2026-4412 was cryptographically generated with valid appointment window 14:00 - 16:00.</text>
  <text x="55" y="864" font-size="10.5" fill="#334155">• Landside Pickup: Authorized transport truck KL-07-AB-1234 (Driver: Suresh Pillai) is presented at In-Gate for optical QR verification and boom barrier release.</text>
</svg>