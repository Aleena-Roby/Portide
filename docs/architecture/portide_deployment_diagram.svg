<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 860" width="920" height="860" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker for Dashed Deployment Links -->
    <marker id="dashArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <style>
      .node-front { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .node-top { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .node-side { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .cyl-top { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .cyl-body { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .cloud-path { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .dash-link { stroke: #1e293b; stroke-width: 1.4; stroke-dasharray: 5,4; fill: none; }
      .text-title { font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-size: 11px; fill: #1e293b; text-anchor: middle; }
      .text-desc { font-size: 10px; fill: #475569; text-anchor: middle; }
      .dots { font-size: 16px; font-weight: bold; fill: #0f172a; letter-spacing: 4px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="890" height="830" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />

  <!-- ==================== 1. USER (PERSON ICON) ==================== -->
  <g id="node-user">
    <!-- Head -->
    <circle cx="105" cy="355" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
    <!-- Shoulders / Torso -->
    <path d="M 78 402 C 78 380, 132 380, 132 402 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
    <!-- Labels -->
    <text x="105" y="424" class="text-title">User</text>
    <text x="105" y="439" class="text-desc">(Port Admin / Operations /</text>
    <text x="105" y="452" class="text-desc">Customs / Terminal /</text>
    <text x="105" y="465" class="text-desc">Shipping / Gate)</text>
  </g>

  <!-- Dashed Arrow from User to Client Device -->
  <line x1="140" y1="380" x2="200" y2="380" class="dash-link" marker-end="url(#dashArrow)" />

  <!-- ==================== 2. CLIENT DEVICE (MONITOR & TOWER) ==================== -->
  <g id="node-client-device">
    <!-- PC Tower -->
    <rect x="210" y="338" width="16" height="58" rx="1.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="218" cy="346" r="2" fill="#0f172a" />
    <line x1="214" y1="354" x2="222" y2="354" stroke="#0f172a" stroke-width="1" />
    <line x1="214" y1="359" x2="222" y2="359" stroke="#0f172a" stroke-width="1" />

    <!-- Monitor Outer Frame -->
    <rect x="230" y="332" width="76" height="52" rx="2.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <!-- Monitor Inner Screen -->
    <rect x="235" y="337" width="66" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="1" />
    <!-- Stand Neck -->
    <rect x="264" y="384" width="8" height="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.3" />
    <!-- Stand Base -->
    <ellipse cx="268" cy="395" rx="18" ry="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />

    <!-- Labels -->
    <text x="268" y="424" class="text-title">Client Device</text>
    <text x="268" y="439" class="text-sub">(Web Browser)</text>
  </g>

  <!-- ==================== 3. WEB SERVER (TOP 3D BOX) ==================== -->
  <!-- Portide Web Server (Vercel CDN) -->
  <g id="node-web-server">
    <!-- Top Face -->
    <polygon points="415,65 433,47 593,47 575,65" class="node-top" />
    <!-- Right Face -->
    <polygon points="575,65 593,47 593,142 575,160" class="node-side" />
    <!-- Front Face -->
    <rect x="415" y="65" width="160" height="95" class="node-front" />

    <!-- Text on Front Face -->
    <text x="495" y="96" class="text-title">Portide Web Server</text>
    <text x="495" y="115" class="text-sub">(Vercel Cloud)</text>
    <text x="495" y="142" class="dots">• • •</text>
  </g>

  <!-- ==================== 4. INTERNET CLOUD (RIGHT) ==================== -->
  <g id="node-internet-cloud">
    <!-- Cloud Path -->
    <path d="M 695 330 
             A 22 22 0 0 1 725 305 
             A 30 30 0 0 1 780 300 
             A 25 25 0 0 1 820 325 
             A 22 22 0 0 1 825 360 
             A 26 26 0 0 1 790 385 
             A 25 25 0 0 1 730 385 
             A 24 24 0 0 1 690 360 
             A 20 20 0 0 1 695 330 Z" 
          class="cloud-path" />

    <!-- Text inside Cloud -->
    <text x="757" y="348" class="text-title">Internet</text>
  </g>

  <!-- ==================== 5. APPLICATION SERVER (MIDDLE-LOWER 3D BOX) ==================== -->
  <!-- Application Server (Django REST / Render Cloud) -->
  <g id="node-app-server">
    <!-- Top Face -->
    <polygon points="445,550 463,532 633,532 615,550" class="node-top" />
    <!-- Right Face -->
    <polygon points="615,550 633,532 633,632 615,650" class="node-side" />
    <!-- Front Face -->
    <rect x="445" y="550" width="170" height="100" class="node-front" />

    <!-- Text on Front Face -->
    <text x="530" y="582" class="text-title">Application Server</text>
    <text x="530" y="601" class="text-sub">(Django REST / Render)</text>
    <text x="530" y="632" class="dots">• • •</text>
  </g>

  <!-- ==================== 6. PERSISTENCE & SERVICES (BOTTOM CYLINDERS) ==================== -->

  <!-- Cylinder 1 (Left): PostgreSQL Database (Supabase) -->
  <g id="cyl-database">
    <!-- Lower Body -->
    <path d="M 315 745 L 315 805 A 50 14 0 0 0 415 805 L 415 745 Z" class="cyl-body" />
    <!-- Top Ellipse -->
    <ellipse cx="365" cy="745" rx="50" ry="14" class="cyl-top" />
    <!-- Labels -->
    <text x="365" y="773" class="text-title">PostgreSQL</text>
    <text x="365" y="788" class="text-title">Database</text>
    <text x="365" y="802" class="text-desc">(Supabase)</text>
  </g>

  <!-- Cylinder 2 (Middle): File Storage (Supabase Media) -->
  <g id="cyl-storage">
    <!-- Lower Body -->
    <path d="M 480 745 L 480 805 A 50 14 0 0 0 580 805 L 580 745 Z" class="cyl-body" />
    <!-- Top Ellipse -->
    <ellipse cx="530" cy="745" rx="50" ry="14" class="cyl-top" />
    <!-- Labels -->
    <text x="530" y="773" class="text-title">File Storage</text>
    <text x="530" y="788" class="text-sub">(Media / Docs)</text>
    <text x="530" y="802" class="text-desc">(Supabase)</text>
  </g>

  <!-- Cylinder 3 (Right): Email & Notification Service -->
  <g id="cyl-email">
    <!-- Lower Body -->
    <path d="M 645 745 L 645 805 A 50 14 0 0 0 745 805 L 745 745 Z" class="cyl-body" />
    <!-- Top Ellipse -->
    <ellipse cx="695" cy="745" rx="50" ry="14" class="cyl-top" />
    <!-- Labels -->
    <text x="695" y="773" class="text-title">Email Service</text>
    <text x="695" y="788" class="text-sub">(Google Script)</text>
    <text x="695" y="802" class="text-desc">(Relay)</text>
  </g>

  <!-- ==================== 7. CURVED DASHED CONNECTION ARROWS ==================== -->

  <!-- Link A: Client Device -> Web Server (Curved up and right) -->
  <path d="M 288 325 C 298 200, 365 110, 410 95" class="dash-link" marker-end="url(#dashArrow)" />

  <!-- Link B: Web Server -> Client Device (Response loop - curved down and left) -->
  <path d="M 415 130 C 330 155, 255 215, 268 322" class="dash-link" marker-end="url(#dashArrow)" />

  <!-- Link C: Web Server -> Internet Cloud (Curved down and right) -->
  <path d="M 593 115 C 685 140, 755 200, 765 292" class="dash-link" marker-end="url(#dashArrow)" />

  <!-- Link D: Internet Cloud -> Application Server (Curved down and left) -->
  <path d="M 750 395 C 725 465, 675 520, 633 552" class="dash-link" marker-end="url(#dashArrow)" />

  <!-- ==================== 8. BRANCHING ARROWS TO PERSISTENCE ==================== -->

  <!-- Branch 1: App Server -> PostgreSQL Database -->
  <path d="M 470 650 L 385 732" class="dash-link" marker-end="url(#dashArrow)" />

  <!-- Branch 2: App Server -> File Storage -->
  <path d="M 530 650 L 530 732" class="dash-link" marker-end="url(#dashArrow)" />

  <!-- Branch 3: App Server -> Email Service -->
  <path d="M 590 650 L 675 732" class="dash-link" marker-end="url(#dashArrow)" />

</svg>