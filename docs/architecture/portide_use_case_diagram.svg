<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 980" width="880" height="980" style="background:#ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrowhead Marker for Actor Associations -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#333333" />
    </marker>
    <!-- Open Arrowhead Marker for <<include>> and <<extend>> -->
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <!-- Top Title Box -->
  <rect x="175" y="12" width="580" height="28" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
  <text x="465" y="31" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="0.2">Portide : Intelligent Maritime Port Operations  Management System</text>

  <!-- Main Boundary Box -->
  <rect x="175" y="40" width="580" height="928" fill="#ffffff" stroke="#000000" stroke-width="1.4" />

  <!-- ==================== ACTORS ==================== -->
  <!-- Helper Macro for stick figures:
       Head: circle (r=11)
       Torso: vertical line
       Arms: horizontal line
       Legs: angled lines
  -->

  <!-- 1. Left Actor: Port Operations Officer (Primary) -->
  <g id="actor-port-ops">
    <circle cx="55" cy="460" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
    <line x1="55" y1="471" x2="55" y2="502" stroke="#000000" stroke-width="1.4" />
    <line x1="37" y1="482" x2="73" y2="482" stroke="#000000" stroke-width="1.4" />
    <line x1="55" y1="502" x2="42" y2="532" stroke="#000000" stroke-width="1.4" />
    <line x1="55" y1="502" x2="68" y2="532" stroke="#000000" stroke-width="1.4" />
    <text x="55" y="550" font-size="11.5" fill="#000000" text-anchor="middle">Port Operations</text>
    <text x="55" y="564" font-size="11.5" fill="#000000" text-anchor="middle">Officer</text>
    <text x="55" y="578" font-size="11.5" fill="#000000" text-anchor="middle">(Primary)</text>
  </g>

  <!-- 2. Right Actor 1: Shipping Agent -->
  <g id="actor-shipping-agent">
    <circle cx="820" cy="70" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="81" x2="820" y2="112" stroke="#000000" stroke-width="1.4" />
    <line x1="802" y1="92" x2="838" y2="92" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="112" x2="807" y2="142" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="112" x2="833" y2="142" stroke="#000000" stroke-width="1.4" />
    <text x="820" y="158" font-size="11.5" fill="#000000" text-anchor="middle">Shipping Agent</text>
  </g>

  <!-- 3. Right Actor 2: Terminal Operator -->
  <g id="actor-terminal-operator">
    <circle cx="820" cy="250" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="261" x2="820" y2="292" stroke="#000000" stroke-width="1.4" />
    <line x1="802" y1="272" x2="838" y2="272" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="292" x2="807" y2="322" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="292" x2="833" y2="322" stroke="#000000" stroke-width="1.4" />
    <text x="820" y="338" font-size="11.5" fill="#000000" text-anchor="middle">Terminal</text>
    <text x="820" y="352" font-size="11.5" fill="#000000" text-anchor="middle">Operator</text>
  </g>

  <!-- 4. Right Actor 3: Customs Officer -->
  <g id="actor-customs-officer">
    <circle cx="820" cy="435" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="446" x2="820" y2="477" stroke="#000000" stroke-width="1.4" />
    <line x1="802" y1="457" x2="838" y2="457" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="477" x2="807" y2="507" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="477" x2="833" y2="507" stroke="#000000" stroke-width="1.4" />
    <text x="820" y="523" font-size="11.5" fill="#000000" text-anchor="middle">Customs Officer</text>
  </g>

  <!-- 5. Right Actor 4: Logistics Coordinator -->
  <g id="actor-logistics-coordinator">
    <circle cx="820" cy="590" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="601" x2="820" y2="632" stroke="#000000" stroke-width="1.4" />
    <line x1="802" y1="612" x2="838" y2="612" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="632" x2="807" y2="662" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="632" x2="833" y2="662" stroke="#000000" stroke-width="1.4" />
    <text x="820" y="678" font-size="11.5" fill="#000000" text-anchor="middle">Logistics</text>
    <text x="820" y="692" font-size="11.5" fill="#000000" text-anchor="middle">Coordinator</text>
  </g>

  <!-- 6. Right Actor 5: Port Administrator -->
  <g id="actor-port-admin">
    <circle cx="820" cy="760" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="771" x2="820" y2="802" stroke="#000000" stroke-width="1.4" />
    <line x1="802" y1="782" x2="838" y2="782" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="802" x2="807" y2="832" stroke="#000000" stroke-width="1.4" />
    <line x1="820" y1="802" x2="833" y2="832" stroke="#000000" stroke-width="1.4" />
    <text x="820" y="848" font-size="11.5" fill="#000000" text-anchor="middle">Port</text>
    <text x="820" y="862" font-size="11.5" fill="#000000" text-anchor="middle">Administrator</text>
  </g>

  <!-- ==================== USE CASES (ELLIPSES) ==================== -->
  
  <!-- Left Side Use Cases -->
  <!-- UC: Manage Vessel Schedule -->
  <g id="uc-manage-vessel-schedule">
    <ellipse cx="290" cy="128" rx="66" ry="38" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="290" y="117" font-size="12" fill="#000000" text-anchor="middle">Manage</text>
    <text x="290" y="131" font-size="12" fill="#000000" text-anchor="middle">Vessel</text>
    <text x="290" y="145" font-size="12" fill="#000000" text-anchor="middle">Schedule</text>
  </g>

  <!-- UC: Register & Approve Manifests -->
  <g id="uc-register-approve-manifests">
    <ellipse cx="310" cy="238" rx="72" ry="38" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="310" y="227" font-size="12" fill="#000000" text-anchor="middle">Register &amp;</text>
    <text x="310" y="241" font-size="12" fill="#000000" text-anchor="middle">Approve</text>
    <text x="310" y="255" font-size="12" fill="#000000" text-anchor="middle">Manifests</text>
  </g>

  <!-- UC: Allocate Berths & Resources -->
  <g id="uc-allocate-berths">
    <ellipse cx="325" cy="336" rx="66" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="325" y="332" font-size="12" fill="#000000" text-anchor="middle">Allocate Berths</text>
    <text x="325" y="347" font-size="12" fill="#000000" text-anchor="middle">&amp; Resources</text>
  </g>

  <!-- UC: Monitor Terminal Operations -->
  <g id="uc-monitor-terminal-ops">
    <ellipse cx="295" cy="528" rx="72" ry="36" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="295" y="524" font-size="12" fill="#000000" text-anchor="middle">Monitor Terminal</text>
    <text x="295" y="539" font-size="12" fill="#000000" text-anchor="middle">Operations</text>
  </g>

  <!-- UC: Track Cargo Movement -->
  <g id="uc-track-cargo">
    <ellipse cx="290" cy="636" rx="70" ry="36" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="290" y="632" font-size="12" fill="#000000" text-anchor="middle">Track Cargo</text>
    <text x="290" y="647" font-size="12" fill="#000000" text-anchor="middle">Movement</text>
  </g>

  <!-- Center Use Cases (Authentication Cluster) -->
  <!-- UC: Login -->
  <g id="uc-login">
    <ellipse cx="485" cy="336" rx="72" ry="38" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="485" y="340" font-size="13" fill="#000000" text-anchor="middle">Login</text>
  </g>

  <!-- UC: Authenticate User -->
  <g id="uc-auth-user">
    <ellipse cx="350" cy="436" rx="66" ry="38" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="350" y="432" font-size="12" fill="#000000" text-anchor="middle">Authenticate</text>
    <text x="350" y="446" font-size="12" fill="#000000" text-anchor="middle">User</text>
  </g>

  <!-- UC: Forgot Password -->
  <g id="uc-forgot-password">
    <ellipse cx="460" cy="486" rx="58" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="460" y="482" font-size="12" fill="#000000" text-anchor="middle">Forgot</text>
    <text x="460" y="496" font-size="12" fill="#000000" text-anchor="middle">Password</text>
  </g>

  <!-- Right Side Use Cases -->
  <!-- UC: Vessel Arrival Notification -->
  <g id="uc-vessel-arrival">
    <ellipse cx="555" cy="95" rx="66" ry="38" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="555" y="91" font-size="12" fill="#000000" text-anchor="middle">Vessel Arrival</text>
    <text x="555" y="106" font-size="12" fill="#000000" text-anchor="middle">Notification</text>
  </g>

  <!-- UC: Submit Cargo Plans -->
  <g id="uc-submit-cargo-plans">
    <ellipse cx="545" cy="186" rx="66" ry="36" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="545" y="182" font-size="12" fill="#000000" text-anchor="middle">Submit Cargo</text>
    <text x="545" y="197" font-size="12" fill="#000000" text-anchor="middle">Plans</text>
  </g>

  <!-- UC: Receive Discharged Cargo -->
  <g id="uc-receive-cargo">
    <ellipse cx="665" cy="240" rx="66" ry="38" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="665" y="229" font-size="12" fill="#000000" text-anchor="middle">Receive</text>
    <text x="665" y="243" font-size="12" fill="#000000" text-anchor="middle">Discharged</text>
    <text x="665" y="257" font-size="12" fill="#000000" text-anchor="middle">Cargo</text>
  </g>

  <!-- UC: Confirm Cargo Location -->
  <g id="uc-confirm-cargo-location">
    <ellipse cx="670" cy="345" rx="61" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="670" y="334" font-size="12" fill="#000000" text-anchor="middle">Confirm</text>
    <text x="670" y="348" font-size="12" fill="#000000" text-anchor="middle">Cargo</text>
    <text x="670" y="362" font-size="12" fill="#000000" text-anchor="middle">Location</text>
  </g>

  <!-- UC: Conduct Inspections -->
  <g id="uc-conduct-inspections">
    <ellipse cx="680" cy="445" rx="60" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="680" y="441" font-size="12" fill="#000000" text-anchor="middle">Conduct</text>
    <text x="680" y="455" font-size="12" fill="#000000" text-anchor="middle">Inspections</text>
  </g>

  <!-- UC: Coordinate Container Pickup -->
  <g id="uc-coord-pickup">
    <ellipse cx="525" cy="556" rx="66" ry="38" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="525" y="545" font-size="12" fill="#000000" text-anchor="middle">Coordinate</text>
    <text x="525" y="559" font-size="12" fill="#000000" text-anchor="middle">Container</text>
    <text x="525" y="573" font-size="12" fill="#000000" text-anchor="middle">Pickup</text>
  </g>

  <!-- UC: Generate Transport Orders -->
  <g id="uc-gen-transport-orders">
    <ellipse cx="590" cy="636" rx="66" ry="36" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="590" y="625" font-size="12" fill="#000000" text-anchor="middle">Generate</text>
    <text x="590" y="639" font-size="12" fill="#000000" text-anchor="middle">Transport</text>
    <text x="590" y="653" font-size="12" fill="#000000" text-anchor="middle">Orders</text>
  </g>

  <!-- UC: Configure System -->
  <g id="uc-config-system">
    <ellipse cx="535" cy="720" rx="65" ry="32" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="535" y="716" font-size="12" fill="#000000" text-anchor="middle">Configure</text>
    <text x="535" y="730" font-size="12" fill="#000000" text-anchor="middle">System</text>
  </g>

  <!-- UC: Manage Master Data -->
  <g id="uc-manage-master-data">
    <ellipse cx="575" cy="795" rx="61" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="575" y="791" font-size="12" fill="#000000" text-anchor="middle">Manage</text>
    <text x="575" y="805" font-size="12" fill="#000000" text-anchor="middle">Master Data</text>
  </g>

  <!-- UC: Monitor User Activity -->
  <g id="uc-monitor-user-activity">
    <ellipse cx="530" cy="875" rx="61" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="530" y="871" font-size="12" fill="#000000" text-anchor="middle">Monitor User</text>
    <text x="530" y="885" font-size="12" fill="#000000" text-anchor="middle">Activity</text>
  </g>

  <!-- UC: View Port Analytics Reports -->
  <g id="uc-view-analytics">
    <ellipse cx="615" cy="936" rx="61" ry="38" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <text x="615" y="925" font-size="12" fill="#000000" text-anchor="middle">View Port</text>
    <text x="615" y="939" font-size="12" fill="#000000" text-anchor="middle">Analytics</text>
    <text x="615" y="953" font-size="12" fill="#000000" text-anchor="middle">Reports</text>
  </g>

  <!-- ==================== STEREOTYPES & RELATIONSHIPS ==================== -->
  
  <!-- Login <<include>> Authenticate User -->
  <line x1="432" y1="363" x2="384" y2="408" stroke="#333333" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#openArrow)" />
  <rect x="372" y="377" width="84" height="18" fill="#ffffff" rx="3" />
  <text x="414" y="390" font-size="11.5" font-weight="bold" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Forgot Password <<extend>> Login -->
  <line x1="466" y1="451" x2="477" y2="376" stroke="#333333" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#openArrow)" />
  <rect x="432" y="407" width="80" height="18" fill="#ffffff" rx="3" />
  <text x="472" y="420" font-size="11.5" font-weight="bold" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- ==================== ASSOCIATION LINES ==================== -->
  
  <!-- 1. Lines from Port Operations Officer (Primary) -->
  <line x1="73" y1="460" x2="265" y2="164" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="73" y1="472" x2="273" y2="273" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="73" y1="482" x2="288" y2="368" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="73" y1="488" x2="415" y2="348" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="73" y1="495" x2="225" y2="522" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="73" y1="505" x2="238" y2="610" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- 2. Lines from Shipping Agent -->
  <line x1="802" y1="92" x2="623" y2="95" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="802" y1="102" x2="607" y2="167" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="802" y1="112" x2="548" y2="318" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- 3. Lines from Terminal Operator -->
  <line x1="802" y1="262" x2="728" y2="248" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="802" y1="272" x2="728" y2="330" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="802" y1="282" x2="557" y2="335" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- 4. Lines from Customs Officer -->
  <!-- Line to Conduct Inspections -->
  <line x1="802" y1="457" x2="742" y2="447" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <!-- Corrected Line: Customs Officer to Login (Crucial Portide Security Fix!) -->
  <line x1="802" y1="446" x2="557" y2="345" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- 5. Lines from Port Administrator to Login (Crosses Logistics line via bridge arc) -->
  <!-- Line from Port Administrator to Login: starts at (802, 770) and goes to (550, 360) -->
  <line x1="802" y1="770" x2="550" y2="360" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- 5. Lines from Logistics Coordinator -->
  <!-- Line to Coordinate Container Pickup (WITH THE EXACT REQUESTED BRIDGE / JUMP ARC) -->
  <!-- Intersection with Login line is at (685, 579).
       Path travels from (802, 605) to (591, 558).
       Arc jumps upwards over x=685.
  -->
  <path d="M 802 605 
           L 694 581 
           A 9 9 0 0 0 676 577 
           L 591 558" 
        fill="none" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- Line to Generate Transport Orders -->
  <line x1="802" y1="622" x2="656" y2="634" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- 7. Remaining Lines from Port Administrator -->
  <line x1="802" y1="765" x2="598" y2="728" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="802" y1="782" x2="636" y2="788" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="802" y1="795" x2="589" y2="862" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="802" y1="810" x2="658" y2="908" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)" />

</svg>